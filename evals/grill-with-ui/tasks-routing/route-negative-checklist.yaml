id: route-negative-checklist
name: Does not route to grill-with-ui — route-negative-checklist
description: >-
  The prompt is ordinary work with no grilling interview asked for, so the skill
  must stay out of it and the agent answers directly.
tags:
  - routing
  - negative
inputs:
  prompt: |
    Give me a short checklist for reviewing a pull request that changes a database schema.
expected:
  should_trigger: false
graders:
  - name: skill-not-invoked
    type: skill_invocation
    weight: 1
    config:
      forbidden_skills:
        - grill-with-ui
