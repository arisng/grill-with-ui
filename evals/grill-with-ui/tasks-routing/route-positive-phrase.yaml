id: route-positive-phrase
name: Routes to grill-with-ui — route-positive-phrase
description: >-
  The prompt names the skill's trigger phrase, so the agent must invoke the skill
  rather than answer the request directly.
tags:
  - routing
  - positive
inputs:
  prompt: |
    grill with ui: how should we structure our CI pipeline

    This is an automated run: there is no browser and no interactive user. If the
    skill applies, do what it asks as far as it can go without a browser, then stop
    and report. Make sure no server process is left running when you stop.
expected:
  should_trigger: true
graders:
  - name: skill-invoked
    type: skill_invocation
    weight: 1
    config:
      required_skills:
        - grill-with-ui
      mode: any_order
