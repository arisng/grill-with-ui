id: spec-verdict-not-warranted
name: Finish does not recommend a spec for a small reversible change
description: >-
  The grill settles one easily reversible choice with an obvious route. Even when the
  repo has a configured tracker and a matching issue, the verdict must be "not
  warranted": size and an anchor are not triggers, and Finish must not tell the user
  to open an issue for work that needs no spec.
tags:
  - behavioral
  - finish
  - spec-readiness
  - negative
inputs:
  prompt: |
    grill with ui: We need to pick the default page size for the CLI's list command —
    ten rows, twenty-five, or all of them.

    This is an automated run: there is no browser and no interactive user. Do exactly
    what the skill's Start flow asks for — create the session, publish round 1, open
    the page, print the URL — then stop and report. Do not wait for browser submissions, and make sure no server process is left
    running when you stop.
  follow_up_prompts:
    - "Answer every open question with option A."
    - "Finish the grill."
expected:
  should_trigger: true
graders:
  - name: spec-not-warranted
    type: program
    weight: 3
    config:
      command: node
      timeout: 60
      args:
        - -e
        - |
          const fs=require('fs'),p=require('path'),os=require('os');
          const ws=process.env.WAZA_WORKSPACE_DIR||process.cwd();
          const F=[];
          function walk(d,depth=0,out=[]){ if(depth>8) return out; let e=[]; try{e=fs.readdirSync(d,{withFileTypes:true})}catch{return out}
            for(const x of e){ if(x.name==='.git'||x.name==='node_modules') continue; const f=p.join(d,x.name);
              if(x.isDirectory()) walk(f,depth+1,out); else out.push(f);} return out; }
          const tag=p.basename(ws);
          const root=p.join(os.homedir(),'.grill-with-ui','sessions');
          const keys=fs.existsSync(root)?fs.readdirSync(root).filter(k=>k.includes(tag)):[];
          const roots=[ws,...keys.map(k=>p.join(root,k))];
          const files=[];
          for(const r of roots) for(const f of walk(r)) files.push(f);
          const specFiles=files.filter(f=>/[\\/]spec\.md$/i.test(f));
          if(specFiles.length) F.push('Finish must not write a spec file; found '+specFiles.join(', '));
          const evs=files.filter(f=>p.basename(f)==='events.jsonl');
          let blob='';
          for(const e of evs){ try{ blob+=fs.readFileSync(e,'utf8'); }catch{} }
          const cands=files.filter(f=>p.basename(f)==='state.json')
            .map(f=>[f,fs.statSync(f).mtimeMs]).sort((a,b)=>b[1]-a[1]);
          if(cands.length) blob+=fs.readFileSync(cands[0][0],'utf8');
          if(!/spec/i.test(blob)) F.push('no spec readiness verdict recorded in the session');
          if(/recommended/i.test(blob) && !/not\s*warranted/i.test(blob)) F.push('the verdict must not be "recommended" for a single reversible choice');
          if(/blocked/i.test(blob) && !/not\s*warranted/i.test(blob)) F.push('a reversible choice needs no spec at all, so it must not be "blocked" (that would ask for an issue needlessly)');
          if(F.length){ console.error('FAIL:\n - '+F.join('\n - ')); process.exit(1); }
          console.log('spec verdict not warranted, no spec file written');
