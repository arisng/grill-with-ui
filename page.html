<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>grill</title>
<style>
  :root {
    --bg: #f7f4ee; --panel: #ffffff; --ink: #1f1c18; --ink-2: #625b51; --ink-3: #9a9285;
    --rule: #e6e0d4; --accent: #9a3a26; --ok: #3d6b4a; --ok-soft: #e3eee5; --stage: #b8791f; --stage-soft: #f8ecd2; --warn-soft: #fbe9e4;
    /* --hover is the row wash, --thumb the scrollbar grip; --stage-ink is --stage darkened to
       clear 4.5:1 as text on --bg, which the 11px status labels need and the amber does not. */
    --hover: #efebe3; --thumb: #d3cbbc; --stage-ink: #8a5a12;
      /* The rest are derived from the palette rather than written inline so dark has somewhere to
         put them: --field is the textarea/input surface, --on-accent is the color the filled
         accent/ok buttons provide themselves, the two --ready-* are the Finish-ready greens, and
         --scrim/--sheet-shadow/--drop-shadow are the overlay elevations (black stops reading as
         depth on a near-black page). */
      --field: #ffffff; --on-accent: #ffffff; --ready-hover: #2f5a3b; --ready-flash: #7fb08d;
      --scrim: rgba(31, 28, 24, .38); --sheet-shadow: -8px 0 30px rgba(0, 0, 0, .14);
      --drop-shadow: 0 8px 24px rgba(0, 0, 0, .08); --sel: rgba(154, 58, 38, .20);
      color-scheme: light;
      --serif: "Iowan Old Style", Charter, Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    /* Dark is the same paper-and-ink vocabulary, not a second design: the warm paper goes cool
       and deep, and the accents were tuned to sit on white, so they lighten here rather than
       darken (the lever light used). Every value is measured against its own surface — body and
       small labels ≥4.5:1, large/UI ≥3:1. There is exactly one dark block because the toggle
       always writes a concrete `data-theme` (light|dark) on <html> before first paint; `system`
       resolves to whichever the OS prefers and re-resolves when the OS changes. */
    :root[data-theme="dark"] {
      --bg: #100e0c; --panel: #191613; --ink: #ece6db; --ink-2: #b3ab9c; --ink-3: #8f867a;
      --rule: #2e2a25; --accent: #e08a6f; --ok: #8ec49b; --ok-soft: #1c2a20; --stage: #d99a3e; --stage-soft: #2a2115; --warn-soft: #2e1d17;
      --hover: #221e1a; --thumb: #4a443c; --stage-ink: #e0a951;
      --field: #131110; --on-accent: #241410; --ready-hover: #a5d6b3; --ready-flash: #6fa982;
      --scrim: rgba(6, 5, 4, .58); --sheet-shadow: -8px 0 30px rgba(0, 0, 0, .6);
      --drop-shadow: 0 8px 24px rgba(0, 0, 0, .5); --sel: rgba(224, 138, 111, .28);
      color-scheme: dark;
    }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans); font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--bg);
    display: grid; grid-template-rows: auto auto 1fr auto; grid-template-columns: 260px minmax(0, 1fr) 33vw; height: 100vh;
  }
  a { color: var(--accent); }
  /* Rows are pinned: the banner is display:none most of the time, and auto-placement would
     otherwise slide the content into the "auto" row and stretch the footer into the "1fr" row. */
  #banner { grid-row: 1; grid-column: 1 / -1; display: none; padding: 9px 24px; font-size: 14px; background: var(--warn-soft); color: var(--accent); border-bottom: 1px solid var(--rule); }
  #banner.show { display: block; } #banner.done { background: var(--ok-soft); color: var(--ok); }

  header { grid-row: 2; grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; padding: 12px 24px; border-bottom: 1px solid var(--rule); background: var(--panel); position: relative; }
  header h1 { font-family: var(--serif); font-weight: 500; font-size: 20px; margin: 0; }
  header .path { color: var(--ink-3); font-size: 13px; }
  #intent { display: none; flex-basis: 100%; order: 10; font-size: 14px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #intent.show { display: block; }
  #intent.show.open { white-space: normal; }
  #intent.show.clamped { cursor: pointer; }
  header .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); } header .status .spin { color: var(--stage); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.working { background: var(--stage); animation: pulse 1.2s ease-in-out infinite; }
  .dot.gone { background: var(--ink-3); }
  @keyframes pulse { 50% { opacity: .3; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; flex-shrink: 0; }
  #progress { display: none; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; background: var(--stage-soft); }
  header.working #progress { display: block; }
  #progress::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--stage); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }
  #terms-toggle, #visualize, #theme-toggle { font-size: 12px; padding: 4px 10px; }
  #theme-toggle { display: inline-flex; align-items: center; justify-content: center; padding: 5px 8px; }
  #theme-toggle svg { width: 14px; height: 14px; display: block; }
  #visualize .spin { width: 9px; height: 9px; margin-right: 4px; }
  #visualize:disabled { background: var(--panel); border-color: var(--rule); color: var(--ink-3); }
  #terms { display: none; position: absolute; right: 24px; top: 100%; width: 420px; max-height: 60vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 16px; box-shadow: var(--drop-shadow); z-index: 5; }
  #terms.show { display: block; }
  .term { padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; } .term:last-child { border-bottom: 0; }
  .term b { font-family: var(--serif); font-weight: 500; font-size: 15px; } .term .avoid { color: var(--ink-3); font-size: 12px; }
  .term .pill { float: right; margin: 1px 0 0 10px; padding: 1px 8px; border: 1px solid var(--rule); border-radius: 999px; background: var(--bg); color: var(--ink-3); font-size: 11px; line-height: 1.5; white-space: nowrap; }
  #terms .glossary-note { margin-top: 8px; font-size: 12px; color: var(--ink-3); }

  /* Every rail rule is scoped to #nav: #pager is also a <nav>, and a bare `nav` selector
     would hand the thumb band the rail's fixed positioning and its scrollbar. */
  #nav { grid-row: 3; grid-column: 1; border-right: 1px solid var(--rule); overflow-y: auto; padding: 10px 0 24px; scrollbar-width: thin; scrollbar-color: var(--thumb) transparent; }
  #nav::-webkit-scrollbar { width: 10px; }
  #nav::-webkit-scrollbar-track { background: transparent; }
  #nav::-webkit-scrollbar-thumb { background: var(--thumb); border: 3px solid transparent; border-radius: 999px; background-clip: content-box; }
  #nav::-webkit-scrollbar-thumb:hover { background: var(--ink-3); background-clip: content-box; }
  #nav .note { margin: 6px 14px 4px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; font-size: 13px; color: var(--ink-2); }
  #nav .round { padding: 16px 20px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); display: flex; justify-content: space-between; }
  #nav .round.current { color: var(--accent); }
  /* The card is two rows: a meta line carrying the identifier and its status, then the title at
     the full width of the rail. A fixed leading column for the id could not hold `q-domain`
     (48px) or `q-slice-boundary` (110px), so long slugs broke mid-word and squeezed the title
     into three ragged lines; id length now costs nothing, and every card measures the same.
     It is a real button so the rail is reachable and operable from the keyboard. */
  .item { display: grid; gap: 2px; width: 100%; padding: 8px 20px; border: 0; border-radius: 0; background: transparent; font: inherit; text-align: left; color: inherit; white-space: normal; cursor: pointer; }
  .item .meta { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .item .id { min-width: 0; font-size: 11px; line-height: 1.35; letter-spacing: .07em; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .t { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; font-size: 14px; line-height: 1.35; overflow: hidden; overflow-wrap: anywhere; }
  .item .mark { margin-left: auto; flex: none; font-size: 11px; line-height: 1.35; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .item .mark svg { width: 12px; height: 12px; }
  .item .upd { flex: none; font-size: 10px; line-height: 1.35; letter-spacing: .06em; text-transform: uppercase; color: var(--stage-ink); }
  .item:hover { background: var(--hover); }
  /* offset -2px keeps the ring inside the rail's scroll clip */
  .item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--hover); }
  .item.selected { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
  .mark.answered { color: var(--ok); } .mark.open, .mark.reopened { color: var(--accent); } .mark.staged, .mark.pending { color: var(--stage-ink); font-weight: 600; }
  #nav .empty { padding: 20px; font-size: 13px; color: var(--ink-2); }

  /* Visualize view: the list and card columns give way to the visual; the right panel becomes its feedback. */
  #visual { grid-row: 3; grid-column: 1 / 3; display: none; grid-template-rows: auto 1fr; min-height: 0; background: var(--panel); }
  body.visualize #visual { display: grid; } body.visualize #nav, body.visualize main, body.visualize #pager { display: none; }
  #visual-strip { display: flex; align-items: center; gap: 14px; padding: 8px 24px; border-bottom: 1px solid var(--rule); font-size: 13px; color: var(--ink-2); background: var(--bg); }
  #visual-strip .kind { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  #visual-strip .ver { color: var(--ink-3); } #visual-strip .ver b { color: var(--ink-2); font-weight: 600; }
  #visual-stale { color: var(--stage); font-size: 12px; }
  #visual-strip .right { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--stage); }
  #visual-strip a { color: var(--ink-3); text-decoration: none; font-size: 13px; } #visual-strip a:hover { color: var(--accent); }
  #visual-frame { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
  /* The wait surface precedes any visual and belongs to the chrome, so it themes; the frame
     itself stays white because visual.html is drawn light (locked: theme stops at the frame). */
  #visual-wait { display: flex; align-items: center; justify-content: center; gap: 10px; height: 100%; color: var(--ink-2); font-size: 14px; background: var(--panel); }
  #visual-wait[hidden], #visual-frame[hidden] { display: none; }

  main { grid-row: 3; grid-column: 2; overflow-y: auto; padding: 36px 44px 60px; background: var(--panel); }
  .card { max-width: 680px; }
  .crumb { font-size: 12px; color: var(--ink-3); display: flex; gap: 12px; flex-wrap: wrap; }
  .crumb a { text-decoration: none; } .crumb .upd { color: var(--stage); }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 8px 0 12px; }
  .card h2 { font-family: var(--serif); font-weight: 500; font-size: 30px; line-height: 1.15; margin: 0; }
  #explore { font-size: 13px; padding: 6px 12px; flex-shrink: 0; }
  #explore:disabled { background: var(--panel); border-color: var(--rule); color: var(--ink-3); }
  .card .body { font-size: 15px; color: var(--ink-2); max-width: 62ch; margin: 0; white-space: pre-line; }
  .opts { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 8px; }
  .opt { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); cursor: pointer; }
  .opt .check { width: 20px; height: 20px; color: var(--ok); visibility: hidden; align-self: center; }
  .opt .check svg, .mark svg { display: block; width: 100%; height: 100%; }
  .opt:hover { border-color: var(--ink-3); }
  .opt .k { font-family: var(--serif); font-size: 18px; line-height: 1.2; color: var(--ink-3); }
  .opt.rec { border-color: var(--accent); } .opt.rec .k { color: var(--accent); }
  .opt .tag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
  .opt.chosen { background: var(--ok-soft); border-color: var(--ok); } .opt.chosen .k, .opt.chosen .tag { color: var(--ok); } .opt.chosen .check { visibility: visible; }
  /* Once an answer is picked (staged or recorded), everything but the picked box reads as disabled; hover or focus wakes a part back up. */
  .card.picked .body, .card.picked .why, .card.picked .answer-row, .card.picked .links, .card.picked .opt:not(.chosen):not(.staged):not(.pending) { opacity: .45; transition: opacity .15s; }
  .card.picked .opt:not(.chosen):not(.staged):not(.pending):hover, .card.picked .answer-row:focus-within, .card.picked .links:hover { opacity: 1; }
  .opt.text-answer { cursor: default; } .opt.text-answer .tag { color: var(--ok); } .opt.text-answer:hover { border-color: var(--ok); }
  .opt.staged { border-color: var(--stage); box-shadow: 0 0 0 1px var(--stage); background: var(--stage-soft); }
  .opt.pending { border-color: var(--stage); border-style: dashed; } .opt.pending .k { color: var(--stage); } .opt .check.pending { visibility: visible; color: var(--stage); display: flex; align-items: center; justify-content: center; }
  .locked .opt { cursor: default; } .locked .opt:hover { border-color: var(--rule); }
  .why { margin: 14px 0 0; font-size: 14px; color: var(--ink-2); white-space: pre-line; } .why b { color: var(--accent); font-weight: 600; }
  .staged-line { margin-top: 10px; font-size: 14px; color: var(--stage); } .staged-line a { color: var(--ink-3); font-size: 12px; margin-left: 8px; }
  .pending-line { margin-top: 10px; font-size: 14px; color: var(--stage); display: flex; align-items: center; gap: 8px; }
  .answer-row { display: flex; gap: 8px; margin-top: 20px; align-items: flex-start; }
  .links { margin-top: 12px; font-size: 13px; display: flex; gap: 14px; } .links a { color: var(--ink-3); text-decoration: none; } .links a:hover { color: var(--accent); }
  textarea { width: 100%; min-height: 60px; font: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--field); resize: vertical; color: var(--ink); }
  textarea:focus { outline: none; border-color: var(--ink-3); }
  /* Browser surfaces carry the design too: selection, caret, focus ring and scrollbars are
     part of the palette, not UA defaults that belong to no theme. */
  ::selection { background: var(--sel); }
  button:focus-visible, a:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  main, aside .msgs, #terms, #nav { scrollbar-width: thin; scrollbar-color: var(--thumb) transparent; }
  button { font-family: var(--sans); font-weight: 500; font-size: 14px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--ink-3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); } button.primary:hover { border-color: var(--accent); }
  button:disabled, button.primary:disabled { background: var(--ink-3); border-color: var(--ink-3); color: var(--on-accent); cursor: default; }
  main .empty { color: var(--ink-3); font-size: 14px; }

  aside { grid-row: 3; grid-column: 3; border-left: 1px solid var(--rule); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  aside .head { padding: 20px 22px 12px; }
  aside .head h3 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  aside .head .sub { font-family: var(--serif); font-size: 16px; margin-top: 4px; }
  aside .head .count { font-size: 12px; color: var(--ink-3); margin-left: 8px; font-family: var(--sans); }
  aside .msgs { overflow-y: auto; padding: 0 22px 12px; }
  .msg { padding: 12px 0; border-top: 1px solid var(--rule); position: relative; }
  .msg .who { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
  .msg.user .who { color: var(--stage); } .msg.agent .who { color: var(--accent); }
  .msg.staged { background: var(--stage-soft); margin: 8px -10px 0; padding: 10px 28px 10px 10px; border-radius: 6px; border-top: 0; }
  .msg.pending { opacity: .7; } .msg.pending .who { display: flex; align-items: center; gap: 6px; }
  .msg .text { font-size: 14px; white-space: pre-line; }
  .msg .rm { position: absolute; right: 8px; top: 8px; color: var(--ink-3); text-decoration: none; font-size: 14px; }
  .empty-thread { padding: 12px 0; font-size: 13px; color: var(--ink-3); border-top: 1px solid var(--rule); }
  .explore-head { padding: 12px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; border-top: 1px solid var(--rule); }
  .explore-wait { padding: 12px 0; font-size: 13px; color: var(--stage); border-top: 1px solid var(--rule); }
  .procon { width: 100%; border-collapse: collapse; font-size: 13px; margin: 2px 0 10px; }
  .procon th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--rule); }
  .procon td { vertical-align: top; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--rule); }
  .procon td.k { font-family: var(--serif); font-size: 16px; color: var(--ink-2); width: 28px; } .procon td.k.rec { color: var(--accent); }
  .procon ul { margin: 0; padding-left: 16px; } .procon li { margin: 0 0 3px; }
  .procon .pro li::marker { color: var(--ok); } .procon .con li::marker { color: var(--accent); }
  aside .compose { padding: 12px 22px 18px; border-top: 1px solid var(--rule); display: grid; gap: 8px; } aside .compose button { justify-self: end; }

  footer { grid-row: 4; grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 12px 24px; border-top: 1px solid var(--rule); background: var(--panel); }
  footer .staged-list { font-size: 13px; color: var(--ink-2); flex: 1; } footer .staged-list b { color: var(--stage); } footer .staged-list .sent { color: var(--stage); display: inline-flex; align-items: center; gap: 6px; }
  #finish.ready { background: var(--ok); border-color: var(--ok); color: var(--on-accent); font-weight: 600; animation: ready 1.2s ease-in-out infinite; }
  #finish.ready:hover { background: var(--ready-hover); border-color: var(--ready-hover); }
  /* The inline confirm keeps the green so the eye stays on it, but stops blinking:
     blinking means "you can act", solid green means "confirm here". */
  #finish-yes.ready { background: var(--ok); border-color: var(--ok); color: var(--on-accent); font-weight: 600; }
  #finish-yes.ready:hover { background: var(--ready-hover); border-color: var(--ready-hover); }
  @keyframes ready { 0%, 100% { background-color: var(--ok); border-color: var(--ok); } 50% { background-color: var(--ready-flash); border-color: var(--ready-flash); } }
  footer .hint { font-size: 12px; color: var(--ink-3); } footer .warn { font-size: 12px; color: var(--accent); }
  footer .confirm { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
  #finish:disabled { background: var(--panel); border-color: var(--rule); color: var(--ink-3); animation: none; } #finish .spin { margin-right: 4px; }

  /* ---- small screens: two tiers, not one ------------------------------------
     A single 760px breakpoint left 768–1399px on the desktop three-column grid, which
     is exactly where a tablet lands: at 768 the question column was 255px and the
     headline 136px. Three tiers instead:
       ≥1400     three columns, unchanged;
       740–1399  two columns — 260px rail + card — the discussion in a right drawer,
                 Terms a header panel;
       ≤739      the card owns the screen; the rail is a left sheet, the discussion a
                 bottom sheet, Terms the header dropdown.
     Desktop starts at 1400 because below it three columns starve the card: the aside
     takes a third of the window whatever the window is, so the reading column only
     reaches its 680px cap once the window passes ~1534px. Two panes at 1399 give the
     card 1139px; three at 1400 give it 678px.
     Two panes start at 740 because the rail is 260px and cannot shrink: 260px is the
     floor at which a long id plus the `updated` badge still fits (at 236px it clipped),
     and the card needs ~420px of measure besides. At 561px — the boundary the
     prototypes used — the card got 214px and the breadcrumb overflowed.
     Every off-screen panel is `fixed`, never `absolute`: an absolutely positioned
     panel parked off-screen extends the document's scrollable overflow, which puts a
     horizontal scrollbar on the whole page while the panel is closed.
     The bounds carry .98 because the layout viewport is fractional under a scaled
     device pixel ratio: at a 1399px window the media width can land just above 1399,
     so `max-width: 1399px` stops matching one pixel early and the desktop grid
     reappears. Ending on .98 keeps each window width inside exactly one tier. */

  #scrim { display: none; position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
  #scrim.on { display: block; }
  #pager, #discuss { display: none; }

  /* A drawer needs an explicit way out: the rail sheet leaves only ~55px of scrim exposed on a
     390px screen, which is not a tap target. The rail's bar is a real element in the markup; the
     discussion's is placed over its existing heading so neither panel needs re-rendering around it. */
  .sheet-head { display: none; position: sticky; top: 0; z-index: 1; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--rule); }
  .sheet-head h2 { margin: 0; flex: 1; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
  .sheet-close { flex: none; padding: 6px 10px; font-size: 12px; }
  aside .head { position: relative; }
  aside .sheet-close { display: none; position: absolute; top: 12px; right: 12px; padding: 6px 10px; font-size: 12px; }

<script>

  else if (isFinishing()) fa.innerHTML = `<button id="finish" type="button" disabled><span class="spin"></span>Finishing…</button>`;
  else if (confirmFinish) fa.innerHTML = `<span class="confirm">Finish this grill? Everything staged goes with it; the agent writes the design doc and stops. <button id="finish-yes" class="ready" type="button">Finish grill</button><button id="finish-no" type="button">Cancel</button></span>`;
  else {
    const a = (S && S.agent) || {}; const gate = sendState(false);
    const ready = allSettled() && a.status !== "working" && !lp && !gone;
    fa.innerHTML = `<button id="finish" type="button" class="${ready ? "ready" : ""}"${gate.disabled ? " disabled" : ""}${ready ? ` title="Every question is settled. Finish writes the design doc."` : gate.disabled && gate.why ? ` title="${esc(gate.why)}"` : ""}>Finish grill</button>`;
  }
  const f = $("finish"); if (f && !f.disabled) f.onclick = () => { confirmFinish = true; render(); };
  const fy = $("finish-yes"); if (fy) fy.onclick = finishNow;
  const fn = $("finish-no"); if (fn) fn.onclick = () => { confirmFinish = false; render(); };
  renderSend();
}
function renderSend() {
  const { disabled, why } = sendState(); const n = stagedCount(); const b = $("send");
  b.disabled = disabled; b.textContent = n ? `Send ${n} to Agent` : "Send to Agent";
  $("send-why").textContent = why;
}

$("send").onclick = send;
$("intent").onclick = () => { if ($("intent").classList.contains("show")) { intentOpen = !intentOpen; render(); } };
$("visualize").onclick = () => { if (hasVisual()) { local.view = activeView() === "visualize" ? "questions" : "visualize"; commit(); } else visualize(); };
$("terms-toggle").onclick = () => { if ($("terms").classList.toggle("show")) fetchGlossary(); }; // refresh on every open
// ---- theme: System → Light → Dark, cycled by one header button -----------------
// The head script already painted a concrete data-theme; this keeps it in step when the
// choice changes or the OS flips its preference while `system` is selected.
const THEME_KEY = "grill-theme";
const THEME_NEXT = { system: "light", light: "dark", dark: "system" };
const THEME_WORD = { system: "follow system", light: "light", dark: "dark" };
// Authored icons, one stroke and weight, no glyph fonts — the cycle is shown, not spelled out.
const THEME_ICON = {
  system: '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.75" y="2.75" width="12.5" height="8.5" rx="1.5"/><path d="M8 11.25v2M5.25 13.75h5.5"/></svg>',
  light: '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.4v1.5M8 13.1v1.5M1.4 8h1.5M13.1 8h1.5M3.4 3.4l1.05 1.05M11.55 11.55l1.05 1.05M12.6 3.4l-1.05 1.05M4.45 11.55L3.4 12.6"/></svg>',
  dark: '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.35 9.65A5.75 5.75 0 0 1 6.35 2.65a5.75 5.75 0 1 0 7 7z"/></svg>',
};
const sysTheme = matchMedia("(prefers-color-scheme: dark)");
let themeMode = (() => { try { const v = localStorage.getItem(THEME_KEY); return v === "light" || v === "dark" ? v : "system"; } catch { return "system"; } })();
function applyTheme() {
  document.documentElement.dataset.theme = themeMode === "system" ? (sysTheme.matches ? "dark" : "light") : themeMode;
  const b = $("theme-toggle"), word = THEME_WORD[themeMode];
  b.innerHTML = THEME_ICON[themeMode];
  b.setAttribute("aria-label", `Theme: ${word}`); b.title = `Theme: ${word}`;
}
sysTheme.addEventListener("change", () => { if (themeMode === "system") applyTheme(); });
$("theme-toggle").onclick = () => {
  themeMode = THEME_NEXT[themeMode];
  try { localStorage.setItem(THEME_KEY, themeMode); } catch {}
  applyTheme();
};
applyTheme();
$("q-open").onclick = () => openSheet("nav");
$("discuss").onclick = () => openSheet("discuss");
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("scrim").onclick = closeSheet;
document.addEventListener("click", (e) => {
  if (!e.target.closest("#terms") && !e.target.closest("#terms-toggle")) $("terms").classList.remove("show");
  if (e.target.closest(".sheet-close")) closeSheet(); // delegated: both sheets rebuild their contents
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { send(); return; }
  if (!sheet) return;
  if (e.key === "Escape") { e.preventDefault(); closeSheet(); return; }
  if (e.key !== "Tab") return;
  // There is one sheet, so its own controls are the whole tab ring while it is open.
  const panel = panelFor(sheet); if (!panel) return;
  const f = [...panel.querySelectorAll(FOCUSABLE)];
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1], act = document.activeElement;
  if (e.shiftKey && (act === first || !panel.contains(act))) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (act === last || !panel.contains(act))) { e.preventDefault(); first.focus(); }
});
// Crossing a tier boundary changes whether a panel is a column or a sheet: re-sync, and drop a
// sheet the new tier no longer has.
window.addEventListener("resize", () => {
  if (sheet === "nav" && !phoneTier()) sheet = null;
  if (sheet === "discuss" && !sheetTier()) sheet = null;
  if (!sheet) sheetOpener = null;
  renderSheets(); renderPager();
});
fetchGlossary(); // once on page load
poll();
</script>
